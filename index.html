<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 18th Birthday, Yanyan 🤍</title>
<style>
  :root {
    --violet: #a78bfa;
    --violet-mid: #8b5cf6;
    --violet-dark: #6d28d9;
    --ink: #4c1d95;
    --pink: #f472b6;
    --paper: rgba(255, 255, 255, 0.95);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 15% 20%, #fdf4ff 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, #e0e7ff 0%, transparent 50%),
                linear-gradient(135deg, #fdf4ff 0%, #ede9fe 50%, #e0e7ff 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; overflow-x: hidden;
  }

  /* ---------- Background ---------- */
  .bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-item { position: absolute; bottom: -60px; opacity: 0.5; user-select: none; animation: rise linear infinite; }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.55; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  .click-heart {
    position: fixed; pointer-events: none; z-index: 9998;
    font-size: 1.3rem; user-select: none;
    animation: heartUp 1.1s ease-out forwards;
  }
  @keyframes heartUp {
    0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% - 90px)) scale(1.2); opacity: 0; }
  }

  /* ---------- Card ---------- */
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 580px; min-height: 640px;
    background: var(--paper);
    border-radius: 34px;
    box-shadow: 0 24px 70px rgba(109, 40, 217, 0.2), 0 0 0 7px rgba(167, 139, 250, 0.22);
    padding: 40px 30px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
    transition: background 0.8s ease;
  }
  .card.purple-theme { background: linear-gradient(160deg, #ddd6fe 0%, #c4b5fd 60%, #a78bfa 100%); }

  .page {
    width: 100%; display: none; flex-direction: column; align-items: center; text-align: center;
    animation: fadeIn 0.8s cubic-bezier(.2,.7,.3,1);
  }
  .page.active { display: flex; }
  .page.leaving { animation: fadeOut 0.5s ease forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px) scale(0.98); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes fadeOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-18px) scale(0.98); }
  }

  h1.title { font-size: 1.7rem; color: var(--violet-dark); margin-bottom: 8px; font-weight: 800; }
  .sub { font-size: 1rem; color: #6b21a8; margin-bottom: 28px; opacity: 0.9; }

  /* ---------- Buttons ---------- */
  .btn {
    background: linear-gradient(135deg, var(--violet) 0%, var(--violet-dark) 100%);
    color: #fff; border: none; cursor: pointer;
    padding: 15px 34px; border-radius: 999px;
    font: inherit; font-size: 1.02rem; font-weight: 800; letter-spacing: 0.6px;
    box-shadow: 0 10px 24px rgba(109, 40, 217, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 30px rgba(109, 40, 217, 0.45); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
  .btn-yiyyyy {
    background: linear-gradient(135deg, var(--pink) 0%, #c026d3 100%);
    font-size: 1.25rem; padding: 17px 44px;
    animation: pop 0.7s cubic-bezier(.2,.9,.3,1.3), heartbeat 1.8s ease-in-out 0.7s infinite;
  }
  @keyframes pop {
    0%   { transform: scale(0.2); opacity: 0; }
    70%  { transform: scale(1.14); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.06); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.04); }
  }

  /* ===== PAGE 1: ENVELOPE ===== */
  .envelope-wrap { position: relative; width: 330px; height: 228px; margin: 22px auto 34px; cursor: pointer; }
  .envelope {
    position: absolute; inset: 0; background: #fff;
    border: 4px solid var(--violet); border-radius: 16px;
    box-shadow: 0 14px 30px rgba(109, 40, 217, 0.25);
    overflow: hidden; transition: transform 0.45s ease;
  }
  .envelope::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 52%;
    background: linear-gradient(180deg, #f5f3ff 0%, #ffffff 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-bottom: 4px solid var(--violet);
    transform-origin: top center; transition: transform 0.8s cubic-bezier(.5,0,.3,1);
    z-index: 2;
  }
  .envelope::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to top right, transparent 49%, var(--violet) 50%, transparent 51%),
      linear-gradient(to top left,  transparent 49%, var(--violet) 50%, transparent 51%);
    opacity: 0.3;
  }
  .envelope-wrap:hover .envelope { transform: translateY(-4px) rotate(-1deg); }
  .envelope-wrap.opening .envelope::before { transform: rotateX(180deg); }
  .envelope-wrap.opening .envelope { transform: scale(1.05); }
  .seal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -30%);
    width: 52px; height: 52px; border-radius: 50%; z-index: 4;
    background: radial-gradient(circle at 35% 30%, #c4b5fd, var(--violet-mid));
    display: flex; align-items: center; justify-content: center; font-size: 1.35rem;
    box-shadow: 0 6px 14px rgba(109, 40, 217, 0.35);
    transition: opacity 0.4s ease;
  }
  .envelope-wrap.opening .seal { opacity: 0; }
  .envelope-label {
    position: absolute; bottom: 16px; left: 0; right: 0; text-align: center;
    font-weight: 800; color: var(--violet-dark); font-size: 0.95rem; letter-spacing: 1.2px; z-index: 3;
  }
  .env-sticker {
    position: absolute; font-size: 2.1rem; z-index: 5; pointer-events: none;
    animation: bob 4s ease-in-out infinite;
    filter: drop-shadow(0 3px 4px rgba(109, 40, 217, 0.2));
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-8px) rotate(6deg); }
  }

  /* ===== PAGE 2: METER ===== */
  .meter-title {
    font-size: 1.9rem; font-weight: 900; color: var(--violet-dark);
    letter-spacing: 2px; margin-bottom: 4px;
    text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(139, 92, 246, 0.25);
  }
  .meter-wrap { position: relative; width: 300px; height: 170px; margin: 14px auto 6px; }
  .meter-svg { width: 100%; height: 100%; overflow: visible; }
  .zone-stroke { fill: none; stroke-width: 22; }
  .tick { stroke: #fff; stroke-width: 2.5; stroke-linecap: round; opacity: 0.9; }
  .needle {
    position: absolute; left: 148px; bottom: 20px; width: 5px; height: 130px;
    background: linear-gradient(to top, var(--violet-dark), var(--pink));
    border-radius: 5px;
    transform-origin: bottom center; transform: rotate(-90deg);
    transition: transform 0.28s cubic-bezier(.3,.9,.4,1);
    box-shadow: 0 0 10px rgba(192, 38, 211, 0.55);
  }
  .needle::after {
    content: ""; position: absolute; top: -7px; left: -5px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; border: 4px solid var(--violet-dark);
  }
  .hub {
    position: absolute; left: 137px; bottom: 7px; width: 26px; height: 26px;
    background: #fff; border: 4px solid var(--violet-dark); border-radius: 50%;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  .percent-display {
    font-size: 3rem; font-weight: 900; color: var(--violet-dark);
    margin: 8px 0 2px; min-width: 150px; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 10px rgba(139, 92, 246, 0.25);
  }
  .percent-display.bump { animation: bump 0.25s ease; }
  @keyframes bump {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .percent-label { font-size: 0.88rem; color: #7e22ce; margin-bottom: 14px; }

  .slider-wrap { width: 100%; max-width: 400px; margin: 4px auto 16px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, #f87171, #fb923c, #fde047, #86efac, #4ade80, #c084fc);
    outline: none; cursor: pointer; box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: 4px solid var(--violet-dark);
    box-shadow: 0 4px 10px rgba(0,0,0,0.22); cursor: grab;
  }
  input[type="range"]::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: 4px solid var(--violet-dark); cursor: grab;
  }
  input[type="range"]:focus-visible { outline: 3px solid var(--pink); outline-offset: 6px; }

  .gif-box {
    width: 100%; max-width: 300px; height: 230px; border-radius: 22px;
    overflow: hidden; background: #faf5ff; border: 3px solid var(--violet);
    box-shadow: 0 10px 24px rgba(109, 40, 217, 0.18);
    margin: 4px auto 0;
    display: flex; align-items: center; justify-content: center;
  }
  .gif-slot {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.35s ease;
  }
  .gif-slot img, .gif-slot iframe { width: 100%; height: 100%; object-fit: contain; border: none; display: block; }
  .gif-link {
    display: inline-block; margin-top: 8px; font-size: 0.84rem;
    color: var(--violet-dark); text-decoration: underline; text-underline-offset: 3px;
  }

  .yiyyyy-slot { min-height: 80px; margin-top: 14px; display: flex; align-items: center; justify-content: center; }

  /* ===== PAGE 3: LETTER ===== */
  .letter-page { width: 100%; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
  .letter {
    background: rgba(255, 255, 255, 0.92); border-radius: 24px; padding: 28px 24px;
    max-height: 520px; overflow-y: auto; text-align: left;
    font-size: 0.96rem; line-height: 1.75; color: var(--ink);
    box-shadow: inset 0 0 0 2px rgba(167, 139, 250, 0.45), 0 10px 30px rgba(109, 40, 217, 0.15);
    scrollbar-width: thin; scrollbar-color: var(--violet) transparent;
  }
  .letter p { white-space: pre-wrap; margin-bottom: 14px; opacity: 0; transform: translateY(8px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .letter p.show { opacity: 1; transform: translateY(0); }
  .letter p.title-line { text-align: center; font-size: 1.25rem; font-weight: 800; color: var(--violet-dark); }

  /* ---------- Small screens ---------- */
  @media (max-width: 520px) {
    .card { padding: 30px 18px; min-height: 600px; border-radius: 26px; }
    .envelope-wrap { width: 270px; height: 190px; }
    .meter-title { font-size: 1.5rem; }
    .percent-display { font-size: 2.4rem; }
    .gif-box { height: 210px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>

<main class="card" id="card">

  <!-- PAGE 1: ENVELOPE -->
  <section class="page active" id="page1">
    <h1 class="title">You've got a letter! 💌</h1>
    <p class="sub">A little something just for you, Yanyan</p>

    <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">
      <div class="envelope">
        <div class="seal">🤍</div>
        <div class="envelope-label">for Rhianne</div>
      </div>
      <span class="env-sticker" style="top:-24px; left:-28px;">🐱</span>
      <span class="env-sticker" style="top:-20px; right:-26px; animation-delay:1s;">⭐</span>
      <span class="env-sticker" style="bottom:-22px; left:-20px; animation-delay:0.5s;">🎂</span>
      <span class="env-sticker" style="bottom:-18px; right:-24px; animation-delay:1.5s;">🐈</span>
      <span class="env-sticker" style="top:50%; left:-44px; transform:translateY(-50%); animation-delay:2s;">💜</span>
      <span class="env-sticker" style="top:50%; right:-44px; transform:translateY(-50%); animation-delay:2.5s;">✨</span>
    </div>

    <button class="btn" id="openBtn">OPEN THE ENVELOPE</button>
  </section>

  <!-- PAGE 2: METER -->
  <section class="page" id="page2">
    <div class="meter-title">HOW CUTE R U?</div>

    <div class="meter-wrap">
      <svg class="meter-svg" viewBox="0 0 300 170" aria-hidden="true">
        <path class="zone-stroke" id="zone-red"    stroke="#ef4444" d=""/>
        <path class="zone-stroke" id="zone-orange" stroke="#f97316" d=""/>
        <path class="zone-stroke" id="zone-yellow" stroke="#facc15" d=""/>
        <path class="zone-stroke" id="zone-lgreen" stroke="#86efac" d=""/>
        <path class="zone-stroke" id="zone-green"  stroke="#22c55e" d=""/>
        <path class="zone-stroke" id="zone-purple" stroke="#a855f7" d=""/>
        <g id="ticks"></g>
      </svg>
      <div class="needle" id="needle"></div>
      <div class="hub"></div>
    </div>

    <div class="percent-display" id="percentDisplay">0%</div>
    <div class="percent-label">slide to measure your cuteness</div>

    <div class="slider-wrap">
      <input type="range" id="slider" min="0" max="100" value="0" step="1" aria-label="Cuteness slider">
    </div>

    <div class="gif-box"><div class="gif-slot" id="gifSlot"></div></div>
    <a class="gif-link" id="gifLink" target="_blank" rel="noopener"></a>

    <div class="yiyyyy-slot" id="yiSlot"></div>
  </section>

  <!-- PAGE 3: LETTER -->
  <section class="page" id="page3">
    <div class="letter-page" oncontextmenu="return false;">
      <div class="letter" id="letterBox"></div>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* =====================================================================
     GIF SETTINGS
     Put these files in the SAME folder as index.html on GitHub:
       cat-1.gif  -> 0-10%
       cat-2.gif  -> 11-30%
       cat-3.gif  -> 31-40%
       cat-4.gif  -> 41-60%
       cat-5.gif  -> 61-80%
       cat-6.gif  -> 81%+
     (Download each GIF from Tenor: right-click -> Save image as.)
     If a file is missing, the Tenor embed for that range is shown instead.
     ===================================================================== */
  const GIF_FILES = [
    "cat-1.gif",   // 0-10%
    "cat-2.gif",   // 11-30%
    "cat-3.gif",   // 31-40%
    "cat-4.gif",   // 41-60%
    "cat-5.gif",   // 61-80%
    "cat-6.gif"    // 81%+
  ];

  const GIF_TENOR = [
    { id: "26981220", slug: "ingprakaikaew-bubududu-gif-26981220" },
    { id: "15640887683992982289", slug: "cat-d%E1%BB%97i-gif-15640887683992982289" },
    { id: "5367489502152433262", slug: "%EB%AA%A8%EC%B0%8C%EB%83%A5-%EB%88%88%EB%AC%BC-gif-5367489502152433262" },
    { id: "21391346", slug: "peach-peach-and-goma-goma-cry-peach-cry-gif-21391346" },
    { id: "4752667077091471880", slug: "5-gif-4752667077091471880" },
    { id: "17791471851031581560", slug: "love-i-love-you-gif-17791471851031581560" }
  ];

  /* ---------- Background ---------- */
  const BG_ITEMS = ["🐱","🌟","🎂","🧁","💜","🤍","✨","🌸","🎀","🦄","🍰","🌙"];
  (function floatBackground() {
    const layer = $("bgLayer");
    const count = window.innerWidth < 520 ? 12 : 20;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("span");
      s.className = "bg-item";
      s.textContent = BG_ITEMS[i % BG_ITEMS.length];
      s.style.left = Math.random() * 96 + "%";
      s.style.fontSize = (1.2 + Math.random() * 1.6) + "rem";
      s.style.animationDuration = (14 + Math.random() * 14) + "s";
      s.style.animationDelay = (-Math.random() * 20) + "s";
      layer.appendChild(s);
    }
  })();

  /* ---------- Click anywhere: little hearts ---------- */
  function spawnHeart(x, y, emoji) {
    const h = document.createElement("span");
    h.className = "click-heart";
    h.textContent = emoji;
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1200);
  }
  document.addEventListener("click", (e) => {
    if (reduceMotion) return;
    if (e.target.closest && e.target.closest("button, a, input, .envelope-wrap")) return;
    spawnHeart(e.clientX, e.clientY, Math.random() > 0.5 ? "🤍" : "💜");
  });

  /* ---------- Page navigation ---------- */
  function showPage(fromEl, toEl, after) {
    fromEl.classList.add("leaving");
    setTimeout(() => {
      fromEl.classList.remove("leaving", "active");
      toEl.classList.add("active");
      if (after) after();
    }, 480);
  }

  /* ---------- Confetti (violet, pink, soft yellow) ---------- */
  const CONFETTI = ["#a78bfa", "#f472b6", "#fde68a"];
  function burst(originXPct, originYPct, count) {
    if (reduceMotion) return;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement("div");
      const size = 6 + Math.random() * 8;
      Object.assign(piece.style, {
        position: "fixed", width: size + "px",
        height: size * (0.4 + Math.random() * 0.6) + "px",
        background: CONFETTI[i % CONFETTI.length],
        left: originXPct + "%", top: originYPct + "%",
        borderRadius: Math.random() > 0.5 ? "50%" : "2px",
        zIndex: 9999, pointerEvents: "none"
      });
      document.body.appendChild(piece);
      const angle = Math.random() * Math.PI * 2;
      const velocity = 180 + Math.random() * 260;
      const dx = Math.cos(angle) * velocity;
      const dy = Math.sin(angle) * velocity - 220;
      const rot = Math.random() * 720 - 360;
      const duration = 1100 + Math.random() * 900;
      piece.animate([
        { transform: "translate(-50%, -50%) rotate(0deg)", opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg)`, opacity: 1, offset: 0.6 },
        { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 260}px)) rotate(${rot * 1.5}deg)`, opacity: 0 }
      ], { duration, easing: "cubic-bezier(.2,.7,.4,1)", fill: "forwards" });
      setTimeout(() => piece.remove(), duration + 50);
    }
  }

  // Hearts raining down (once, when the 81%+ cat first appears)
  function heartRain() {
    if (reduceMotion) return;
    for (let i = 0; i < 26; i++) {
      setTimeout(() => {
        const h = document.createElement("span");
        h.textContent = Math.random() > 0.5 ? "💜" : "🤍";
        Object.assign(h.style, {
          position: "fixed", top: "-40px", left: Math.random() * 100 + "%",
          fontSize: (1 + Math.random() * 1.2) + "rem", zIndex: 9999, pointerEvents: "none",
          transition: "transform 2.4s linear, opacity 2.4s linear"
        });
        document.body.appendChild(h);
        requestAnimationFrame(() => {
          h.style.transform = `translateY(${window.innerHeight + 80}px) rotate(${Math.random() * 360}deg)`;
          h.style.opacity = "0";
        });
        setTimeout(() => h.remove(), 2600);
      }, i * 110);
    }
  }

  /* ---------- Envelope -> meter ---------- */
  const page1 = $("page1"), page2 = $("page2"), page3 = $("page3");
  function openEnvelope() {
    if ($("envelope").classList.contains("opening")) return;
    $("envelope").classList.add("opening");
    burst(50, 45, 120);
    setTimeout(() => showPage(page1, page2, buildMeter), 950);
  }
  $("openBtn").addEventListener("click", openEnvelope);
  $("envelope").addEventListener("click", openEnvelope);
  $("envelope").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); }
  });

  /* ---------- Meter geometry (0% left, 100% right) ---------- */
  const CX = 150, CY = 150, R = 130;
  function polar(pct, radius) {
    const r = radius || R;
    const angle = Math.PI - (pct / 100) * Math.PI;
    return { x: CX + r * Math.cos(angle), y: CY - r * Math.sin(angle) };
  }
  function arcPath(a, b) {
    const p1 = polar(a), p2 = polar(b);
    const large = (b - a) > 50 ? 1 : 0;
    return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  function buildMeter() {
    const zones = [
      ["zone-red", 0, 10.5], ["zone-orange", 10.5, 30.5], ["zone-yellow", 30.5, 40.5],
      ["zone-lgreen", 40.5, 60.5], ["zone-green", 60.5, 80.5], ["zone-purple", 80.5, 100]
    ];
    zones.forEach(([id, a, b]) => $(id).setAttribute("d", arcPath(a, b)));

    // White tick marks at zone boundaries
    const ticks = $("ticks");
    [10.5, 30.5, 40.5, 60.5, 80.5].forEach(p => {
      const a = polar(p, R - 12), b = polar(p, R + 12);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "tick");
      line.setAttribute("x1", a.x.toFixed(2)); line.setAttribute("y1", a.y.toFixed(2));
      line.setAttribute("x2", b.x.toFixed(2)); line.setAttribute("y2", b.y.toFixed(2));
      ticks.appendChild(line);
    });
  }

  /* ---------- GIF display ---------- */
  function gifIndexFor(p) {
    if (p <= 10) return 0;
    if (p <= 30) return 1;
    if (p <= 40) return 2;
    if (p <= 60) return 3;
    if (p <= 80) return 4;
    return 5;
  }
  function showFallbackCard(idx) {
    $("gifSlot").innerHTML =
      `<div style="text-align:center;padding:14px;color:#6d28d9;font-weight:700;">
         <div style="font-size:3.2rem;line-height:1.2;">🐱</div>
         <div style="font-size:0.9rem;margin:6px 0 10px;">This GIF can't load here</div>
         <a href="https://tenor.com/view/${GIF_TENOR[idx].slug}" target="_blank" rel="noopener"
            style="color:#7c3aed;text-decoration:underline;">Open it on Tenor</a>
       </div>`;
  }

  let currentGif = -1;
  function showTenorFallback(idx) {
    $("gifSlot").innerHTML =
      `<iframe src="https://tenor.com/embed/${GIF_TENOR[idx].id}" title="cat reaction" allowfullscreen></iframe>`;
  }
  function updateGif(raw) {
    const idx = gifIndexFor(raw);              // follows where the arrow lands
    if (idx === currentGif) return;
    currentGif = idx;
    const slot = $("gifSlot");
    slot.style.opacity = 0;
    setTimeout(() => {
      const img = new Image();
      img.alt = "cat reaction";
      img.onload = () => { slot.innerHTML = ""; slot.appendChild(img); slot.style.opacity = 1; };
      img.referrerPolicy = "no-referrer";
      img.onerror = () => { showFallbackCard(idx); slot.style.opacity = 1; };
      img.src = GIF_FILES[idx];
    }, 260);
    const link = $("gifLink");
    link.href = `https://tenor.com/view/${GIF_TENOR[idx].slug}`;
    link.textContent = "Open this GIF on Tenor";
    if (idx === 5 && !window.__loveShown) { window.__loveShown = true; heartRain(); }
  }

  /* ---------- Needle + counter ---------- */
  const slider = $("slider"), needle = $("needle"), percentDisplay = $("percentDisplay");
  function setNeedle(raw) {
    const clamped = Math.max(0, Math.min(100, raw));
    needle.style.transform = `rotate(${-90 + (clamped / 100) * 180}deg)`;
  }

  let peak = 0;            // highest value reached; climbs past 100 and never drops
  let yiyyyyShown = false;
  let climbTimer = null;
  let lastMilestone = 0;

  function paintPercent() {
    const val = Math.round(peak) + "%";
    if (percentDisplay.textContent !== val) {
      percentDisplay.textContent = val;
      percentDisplay.classList.remove("bump");
      void percentDisplay.offsetWidth;
      percentDisplay.classList.add("bump");
    }
  }

  function showYiyyyy() {
    yiyyyyShown = true;
    const btn = document.createElement("button");
    btn.className = "btn btn-yiyyyy";
    btn.textContent = "YIYYYY";
    btn.addEventListener("click", goToLetter);
    $("yiSlot").appendChild(btn);
    burst(50, 55, 90);
  }

  // Once 100% is reached, the number climbs by itself until the page is refreshed.
  function startClimb() {
    if (climbTimer) return;
    climbTimer = setInterval(() => {
      peak += 1;
      paintPercent();
      // small sparkle every 50 above 100
      if (Math.round(peak) % 50 === 0 && Math.round(peak) > lastMilestone) {
        lastMilestone = Math.round(peak);
        burst(50, 30, 30);
      }
    }, 150);
  }

  function render() {
    const raw = Number(slider.value);
    if (raw > peak && raw <= 100) peak = raw;
    paintPercent();
    setNeedle(raw);
    updateGif(raw);
    if (peak >= 100) {
      if (!yiyyyyShown) showYiyyyy();
      startClimb();
    }
  }
  slider.addEventListener("input", render);
  render();

  /* ---------- Meter -> letter ---------- */
  function goToLetter() {
    $("card").classList.add("purple-theme");
    showPage(page2, page3, buildLetter);
  }

  /* ---------- Letter (paragraphs fade in one by one) ---------- */
  const LETTER_PARAS = [
    { text: `Happy Birthday, Rhianne! 🤍`, title: true },
    { text: `First of all, happy birthday to youuu!! I hope today brings you as much happiness as you bring to the people around you. You deserve so many good things in life, and I hope this new chapter of yours will be filled with happiness, peace, growth, and moments that make you genuinely smile.` },
    { text: `Honestly, I'm really glad that I got to know you. It's funny how someone can come into your life unexpectedly and slowly become someone you look forward to talking to every day. I didn't expect you to become someone this special to me, but here we are HAHAHAHA. 😭` },
    { text: `There's something about being around you that makes things feel lighter. I like how I can lower my guard and be comfortable, even if di kaayu tah mag talk sa personal, and just enjoy your company without feeling like I have to be someone else. You have this way of making ordinary moments feel a little more special, and I hope you know that, even in ways you might not notice, your presence can make someone's day better. But I hope we'll talk na sa personal even if random things HAHAHAHAHAH I honestly love talking with you and you're so cute when you do that random impressions😁` },
    { text: `As you turn another year older, I hope you never forget to take care of yourself, too. I hope you give yourself the same kindness you give to others. And on the days when things get tiring or overwhelming, I hope you remember that you don't always have to be okay, and you don't have to figure everything out all at once. You're allowed to rest, take your time, and enjoy life at your own pace.` },
    { text: `I'm not really the best at putting feelings into words, but I just want you to know that I'm genuinely happy I met you. Thank you for making some time even if you're exhausted and the little moments that might seem ordinary but mean something to me. I hope I get to make more memories with you, whether they're big moments or just us doing the most random things imaginable. HAHAHAHA.` },
    { text: `Happy 18th birthday again, Rhianne!🥳 Welcome to another chapter of your life. I hope you enjoy every bit of it, make memories worth keeping, and continue becoming the person you want to be. Never feel like you have to rush growing up. There's still so much waiting for you, and I hope life treats you kindly along the way.` },
    { text: `Keep being you, Yanyan. And if there's one thing I hope you remember from this letter, it's that I'm really glad our paths crossed.` },
    { text: `And you are genuinely so cute when you smile it'll always warmth my heart when I see you smiling🥰\nEnjoy your special day, birthday girl. You deserve to be celebrated. 🤍` },
    { text: `— Rave` }
  ];

  function buildLetter() {
    const box = $("letterBox");
    box.innerHTML = "";
    LETTER_PARAS.forEach((item, i) => {
      const p = document.createElement("p");
      p.textContent = item.text;
      if (item.title) p.classList.add("title-line");
      box.appendChild(p);
      setTimeout(() => p.classList.add("show"), 250 + i * (reduceMotion ? 0 : 450));
    });
  }

  /* ---------- Letter protection ---------- */
  ["copy", "cut", "paste", "contextmenu", "dragstart", "selectstart"].forEach(ev =>
    document.addEventListener(ev, (e) => {
      if (e.target.closest && e.target.closest("#page3")) e.preventDefault();
    })
  );
  document.addEventListener("keydown", (e) => {
    if (!page3.classList.contains("active")) return;
    if ((e.ctrlKey || e.metaKey) && ["a", "c", "x", "v", "s", "p", "u"].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
